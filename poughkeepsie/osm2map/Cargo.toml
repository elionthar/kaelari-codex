[package]
name = "osm2map"
version.workspace = true
edition.workspace = true
description = "Download downtown Poughkeepsie from Overpass and convert it to a .pkm tile map"

[dependencies]
pkmap = { path = "../pkmap" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "native-certs", "proxy-from-env"] }
